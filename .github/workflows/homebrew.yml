name: Homebrew installation

on:
  push:
    branches: [main]
    paths:
      - Formula/**
      - scripts/**
      - .github/workflows/homebrew.yml
  pull_request:
    paths:
      - Formula/**
      - scripts/**
      - .github/workflows/homebrew.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Apple Silicon Homebrew
        run: |
          test "$(uname -m)" = arm64
          brew update
          # Hosted images may expose OpenSSL 1.1 through the shared bin directory.
          ai_lab_brew_prefix="$(brew --prefix)"
          ai_lab_openssl_link="$ai_lab_brew_prefix/bin/openssl"
          if test -L "$ai_lab_openssl_link" && test "$(readlink "$ai_lab_openssl_link")" = "$ai_lab_brew_prefix/opt/openssl@1.1/bin/openssl"; then
            unlink "$ai_lab_openssl_link"
          fi
          brew tap iamorlando/ai_lab
          cp Formula/ai_lab.rb "$(brew --repository iamorlando/ai_lab)/Formula/ai_lab.rb"
          brew trust --formula iamorlando/ai_lab/ai_lab
      - name: Install and check post-install linkage
        run: |
          brew install iamorlando/ai_lab/ai_lab 2>&1 | tee "$RUNNER_TEMP/ai-lab-install.log"
          if /usr/bin/grep -E 'HeaderPadError|Failed to fix install linkage|did not complete successfully|Could not symlink|Error:' "$RUNNER_TEMP/ai-lab-install.log"; then
            exit 1
          fi
          brew linkage --test iamorlando/ai_lab/ai_lab
      - name: Test the installed application
        run: |
          brew test iamorlando/ai_lab/ai_lab
          ai-lab --version
          ai-lab completion --api-schema > "$RUNNER_TEMP/ai-lab-schema.json"
          ai-lab --json > "$RUNNER_TEMP/ai-lab-help.json"
      - name: Install the native runtime without developer tools
        run: |
          ai_lab_python="$(brew --prefix ai_lab)/libexec/venv/bin/python"
          env DEVELOPER_DIR=/nonexistent PATH=/usr/bin:/bin "$ai_lab_python" - <<'PYCODE'
          import json
          from pathlib import Path
          import tempfile
          from ai_lab.setup import prepare, doctor
          from ai_lab.runtime import install, install_decisions, decisions_ready
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              prepare(root)
              assert doctor(root)['prerequisites'] == {}
              build = install(root)
              assert build['distribution'] == 'prebuilt'
              print(json.dumps(build))
              native = install_decisions(root)
              assert native['distribution'] == 'prebuilt'
              assert native['decision_support'] is True
              assert decisions_ready(root)
              print(json.dumps(native))
          PYCODE
      - name: Exercise the installed website and model editor
        run: |
          python3 scripts/check_web.py "$(brew --prefix ai_lab)/bin/ai-lab"
          python3 scripts/check_web.py "$(brew --prefix ai_lab)/bin/ai-lab" --jev-configured
      - name: Exercise client-launched MCP and persistent watermark configuration
        run: |
          uv run --python 3.13 --with 'mcp==1.30.0' python scripts/check_mcp.py --executable "$(brew --prefix ai_lab)/bin/ai-lab"
      - name: Verify installed release bytes and local agent fixtures
        run: |
          ai_lab_python="$(brew --prefix ai_lab)/libexec/venv/bin/python"
          ai_lab_version="$(ai-lab --version | awk '{print $3}')"
          ai_lab_release="https://github.com/iamorlando/homebrew-ai_lab/releases/download/ai_lab-v${ai_lab_version}"
          ai_lab_wheel="$RUNNER_TEMP/ai_lab-${ai_lab_version}-py3-none-any.whl"
          ai_lab_source="$RUNNER_TEMP/ai_lab-${ai_lab_version}.tar.gz"
          curl --fail --location "$ai_lab_release/ai_lab-${ai_lab_version}-py3-none-any.whl" --output "$ai_lab_wheel"
          curl --fail --location "$ai_lab_release/ai_lab-${ai_lab_version}.tar.gz" --output "$ai_lab_source"
          "$ai_lab_python" -I - "$ai_lab_wheel" <<'PYCODE'
          import hashlib
          from pathlib import Path
          import sys
          import zipfile
          import ai_lab
          site = Path(ai_lab.__file__).resolve().parent.parent
          checked = 0
          package_paths = set()
          with zipfile.ZipFile(sys.argv[1]) as wheel:
              for entry in wheel.infolist():
                  name = entry.filename
                  path = Path(name)
                  if name.endswith('/') or not name.startswith('ai_lab/'):
                      continue
                  assert not path.is_absolute() and '..' not in path.parts
                  canonical = path.as_posix()
                  assert canonical not in package_paths, name
                  package_paths.add(canonical)
                  installed = site / path
                  assert installed.is_file(), name
                  assert hashlib.sha256(installed.read_bytes()).digest() == hashlib.sha256(wheel.read(entry)).digest(), name
                  checked += 1
          assert checked > 100, checked
          print(f'Verified {checked} installed application files against the published wheel')
          PYCODE
          "$ai_lab_python" scripts/check_mcp_client.py --installed --wheel "$ai_lab_wheel" --sdist "$ai_lab_source"
          "$ai_lab_python" scripts/check_agent.py --wheel "$ai_lab_wheel" --sdist "$ai_lab_source"
          python3 scripts/check_cross_model_profiles.py --python "$ai_lab_python"
          python3 scripts/check_cross_model_chat.py --python "$ai_lab_python"
          python3 scripts/check_cross_model_chat.py --python "$ai_lab_python" --required-only
          "$ai_lab_python" scripts/check_decisions.py --wheel "$ai_lab_wheel" --sdist "$ai_lab_source"
          "$ai_lab_python" scripts/check_decoder.py --installed --wheel "$ai_lab_wheel" --sdist "$ai_lab_source"
          "$ai_lab_python" -I scripts/check_services.py
          "$ai_lab_python" scripts/check_api_skills.py --python "$ai_lab_python" --canonical
          "$ai_lab_python" -I scripts/check_storage.py
