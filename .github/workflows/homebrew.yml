name: Candidate Homebrew install
on:
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: Unpublished release containing the exact candidate sdist
        required: true
        type: string
permissions:
  contents: read
jobs:
  installed-web:
    strategy:
      fail-fast: false
      matrix:
        installation: [clean, upgrade]
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ runner.temp }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_CACHE: ${{ runner.temp }}/brew-cache
      AI_LAB_ROOT: ${{ runner.temp }}/retained-ai-lab-data
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download exact private candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          test "$(uname -m)" = arm64
          python3 "$GITHUB_WORKSPACE/scripts/candidate_homebrew.py" download --release-id "$DRAFT_RELEASE_ID" --directory "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/evidence"
      - name: Actual clean install or literal upgrade and installed checks
        env:
          INSTALLATION: ${{ matrix.installation }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/candidate_homebrew.py" install --mode "$INSTALLATION" --directory "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/evidence"
      - name: Retain exact commands and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-${{ matrix.installation }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/brew-cache
          retention-days: 14
